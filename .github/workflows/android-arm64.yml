name: RelayBridge Android ARMv8

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-arm64-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build arm64-v8a APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Locate Android Studio project
        shell: bash
        run: |
          if [[ -f app/build.gradle && -f gradlew ]]; then
            echo 'RELAY_PROJECT_DIR=.' >> "$GITHUB_ENV"
          elif [[ -f RelayBridge/app/build.gradle && -f RelayBridge/gradlew ]]; then
            echo 'RELAY_PROJECT_DIR=RelayBridge' >> "$GITHUB_ENV"
          else
            echo 'Android Studio project not found' >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle
            **/gradle-wrapper.properties

      - name: Install Android SDK packages
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" 'platforms;android-36' 'build-tools;35.0.0'

      - name: Validate wrapper and build ARMv8
        working-directory: ${{ env.RELAY_PROJECT_DIR }}
        shell: bash
        run: |
          chmod +x gradlew
          python3 scripts/check-wrapper.py
          python3 scripts/prepare-build.py
          ./gradlew --no-daemon --console=plain -PrelayAbi=arm64-v8a \
            testDebugUnitTest lintDebug assembleDebug

      - name: Verify APK version, signature and native ABIs
        working-directory: ${{ env.RELAY_PROJECT_DIR }}
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs \
            app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging \
            app/build/outputs/apk/debug/app-debug.apk > app/build/apk-badging.txt
          python3 scripts/verify-apk.py app/build/outputs/apk/debug/app-debug.apk \
            app/build/apk-badging.txt
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp app/build/outputs/apk/debug/app-debug.apk \
            "$GITHUB_WORKSPACE/artifacts/RelayBridge-2.0-arm64-v8a.apk"
          cd "$GITHUB_WORKSPACE/artifacts"
          sha256sum RelayBridge-2.0-arm64-v8a.apk > SHA256SUMS.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: RelayBridge-2.0-arm64-v8a
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: RelayBridge-build-reports
          path: |
            ${{ env.RELAY_PROJECT_DIR }}/app/build/reports/
            ${{ env.RELAY_PROJECT_DIR }}/app/build/test-results/
            ${{ env.RELAY_PROJECT_DIR }}/app/build/apk-badging.txt
          if-no-files-found: warn
          retention-days: 14
