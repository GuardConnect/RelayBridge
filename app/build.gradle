plugins { id 'com.android.application' }
android {
    namespace 'ru.eyeone.relaybridge'
    compileSdk 36
    defaultConfig { applicationId 'ru.eyeone.relaybridge'; minSdk 35; targetSdk 36; versionCode 22; versionName '2.5'; testInstrumentationRunner 'ru.eyeone.relaybridge.SmokeInstrumentation' }
    // CI may explicitly restrict any future JNI dependencies to ARMv8.
    def relayAbi = providers.gradleProperty('relayAbi').orNull
    if (relayAbi != null) {
        if (relayAbi != 'arm64-v8a') throw new GradleException('Unsupported relayAbi; use arm64-v8a')
        defaultConfig.ndk.abiFilters.add(relayAbi)
    }
    buildFeatures { buildConfig true }
    testOptions { unitTests.includeAndroidResources = true; unitTests.all { forkEvery = 1 } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs { debug { storeFile file('../development-signing.keystore'); storePassword 'android'; keyAlias 'AndroidDebugKey'; keyPassword 'android' } }
    buildTypes { debug { debuggable false }; release { debuggable false } }
    // Production upload signing belongs to the publisher. Never use the shared development key.
    def uploadStore = System.getenv('RELAY_UPLOAD_STORE')
    if (uploadStore) {
        signingConfigs { upload { storeFile file(uploadStore); storePassword System.getenv('RELAY_UPLOAD_STORE_PASSWORD'); keyAlias System.getenv('RELAY_UPLOAD_ALIAS'); keyPassword System.getenv('RELAY_UPLOAD_KEY_PASSWORD') } }
        buildTypes.release.signingConfig = signingConfigs.upload
    } else if (providers.gradleProperty('relayDevelopmentSigning').orNull == 'true') {
        // Explicit opt-in for installing/testing release builds with the existing public key.
        buildTypes.release.signingConfig = signingConfigs.debug
    }
    packaging { resources { excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*'] } }
}
dependencies {
    implementation 'androidx.work:work-runtime:2.10.1'
    implementation 'androidx.activity:activity:1.12.4'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
